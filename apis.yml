aid: proxima
name: Proxima
description: >-
  Proxima (Proxima Bio) is a preclinical biotechnology company making protein
  interactions programmable through an integrated discovery platform that
  combines artificial intelligence, machine learning, and structural proteomics.
  Building on a proprietary atlas of protein cross-linking data, Proxima trains
  models that design proximity modulators - Inducers, Modulators, and Blockers -
  small-molecule therapeutics that induce or block protein-protein complexes to
  address cancer, autoimmune disorders, and other hard-to-treat diseases. The
  company is backed by DCVC and collaborates with major pharmaceutical firms. It
  is listed in the API Evangelist network as a company profile; as of this pass
  Proxima publishes no public developer API, SDK, or developer portal.
